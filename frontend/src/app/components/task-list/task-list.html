@if (tasks().length === 0) {
  <p class="empty">No tasks yet — add your first one above! 🎯</p>
} @else {
  <p class="summary">{{ completedCount() }} of {{ totalCount() }} done</p>

  <ul class="task-list">
    @for (task of tasks(); track task.id) {
      <li class="task-item">
        <app-task-item
          [task]="task"
          (toggled)="toggle(task.id)"
          (deleteRequested)="confirmDelete(task)"
          (titleChanged)="rename(task.id, $event)"
        />
      </li>
    }
  </ul>
}
