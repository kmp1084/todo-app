<mat-toolbar class="app-toolbar" role="banner">
  <a routerLink="/" class="app-home-link">
    <mat-icon aria-hidden="true">checklist</mat-icon>
    <h1 class="app-title">{{ title() }}</h1>
  </a>
  <span class="spacer"></span>
    <span class="spacer"></span>
    @if (isLoggedIn()) {
    <span class="user-email">{{ userEmail() }}</span>
    <button matButton (click)="logout()">Log out</button>
    } @else {
    <a matButton routerLink="/login">Log in</a>
    }
    @if (showCategoryButton()) {
      <button matIconButton aria-label="Manage categories" (click)="manageCategories()">
        <mat-icon>settings</mat-icon>
      </button>
    }
</mat-toolbar>

<main class="content">
  @if (error(); as message) {
    <div class="error-banner" role="alert">
      <span>{{ message }}</span>
      <button type="button" (click)="dismissError()" aria-label="Dismiss error">✕</button>
    </div>
  }
  <router-outlet />
</main>
