spring.application.name=todos-api
spring.jpa.open-in-view=false

# File-backed H2 so data survives restarts (./data/todos.mv.db)
spring.datasource.url=jdbc:h2:file:./data/todos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/alters tables from the entities. Dev only.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# RFC 9457 problem+json error bodies
spring.mvc.problemdetails.enabled=true
#logging.level.org.springframework.web=DEBUG

app.cors.allowed-origins=http://localhost:4200

# JWT — the secret MUST be at least 32 characters for HS256
app.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-32chars-min}
app.jwt.issuer=todos-api
app.jwt.expiry-minutes=60
