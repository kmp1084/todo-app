spring.application.name=todos-api
spring.jpa.open-in-view=false

# File-backed H2 so data survives restarts (./data/todos.mv.db)
spring.datasource.url=jdbc:h2:file:./data/todos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates/alters tables from the entities. Dev only.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
