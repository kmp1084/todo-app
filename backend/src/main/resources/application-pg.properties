# Local Postgres via docker-compose — same engine as production, local everything else.
spring.datasource.url=jdbc:postgresql://localhost:5432/todos
spring.datasource.username=todos
spring.datasource.password=todos

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:4200
app.jwt.secret=dev-only-secret-please-change-me-32chars-min